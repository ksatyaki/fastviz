x-fastviz-common: &fastviz-common
  user: dev
  network_mode: host
  ipc: host
  environment:
    DISPLAY: ${DISPLAY:-}
    WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
    XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: 69
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
    WGPU_BACKEND: vulkan
    RUST_LOG: info
  # Vulkan driver libs + the NVIDIA ICD manifest are injected by
  # nvidia-container-toolkit at runtime (NVIDIA_DRIVER_CAPABILITIES includes
  # `graphics`); the image also bakes a fallback manifest. Do NOT bind-mount the
  # host's /usr/share/vulkan/icd.d, /etc/vulkan/icd.d or /usr/lib/* — on a Fedora
  # host those point at /usr/lib64 paths that don't exist in this Ubuntu image
  # and shadow the working setup. Mesa llvmpipe (mesa-vulkan-drivers) is the
  # non-NVIDIA fallback.
  volumes:
    - .:/workspaces/fastviz:cached
    - ${HOME}/.claude:/home/dev/.claude
    - /tmp/.X11-unix:/tmp/.X11-unix
    # Wayland socket (and dbus/pulse) live under XDG_RUNTIME_DIR; needed for WSI
    # presentation. dev is UID 1000, matching the host user, so perms line up.
    - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
  devices:
    - /dev/dri
    - /dev/nvidia0
    - /dev/nvidiactl
    - /dev/nvidia-modeset
  # On a non-NVIDIA host, comment out the deploy block; Mesa llvmpipe is used.
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu,compute,utility,graphics,display]
  command: sleep infinity

services:
  jazzy:
    <<: *fastviz-common
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: dev
        USER_UID: "1000"
        USER_GID: "1000"
        ROS_DISTRO: jazzy

  humble:
    <<: *fastviz-common
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: dev
        USER_UID: "1000"
        USER_GID: "1000"
        ROS_DISTRO: humble
