[workspace]
members = [
    "crates/app",
    "crates/renderer",
    "crates/scene",
    "crates/mock_injector",
    "crates/ros_node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
wgpu = "22"
winit = "0.30"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
r2r = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
