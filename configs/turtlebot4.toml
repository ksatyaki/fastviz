# fastviz config for the TurtleBot 4 Gazebo Harmonic simulation.
# Run with:
#   cargo run -p app -- --config configs/turtlebot4.toml
#
# `robot_state_publisher` latches the expanded URDF on `/robot_description`,
# so we pick it up straight off the topic — no need to pre-expand the xacro.
#
# Sim is launched separately, e.g.:
#   ros2 launch turtlebot4_ignition_bringup turtlebot4_ignition.launch.py

node_name       = "fastviz"
namespace       = ""
# The sim publishes odom -> base_link continuously; map is only present once
# SLAM/Nav2 are running. Use odom so the robot appears immediately.
reference_frame = "map"

[tf]
topic        = "/tf"
static_topic = "/tf_static"

[urdf]
topic              = "/robot_description"
joint_states_topic = "/joint_states"

# sensor_msgs/LaserScan — RPLidar A1 on the TurtleBot 4.
[scans]
topics = ["/sensors/lidar3d_0/scan"]
style  = { size = 4.0, color = [1.0, 0.95, 0.20] }

# sensor_msgs/PointCloud2 — OAK-D stereo cloud.
[points]
topics = ["/sensors/lidar3d_0/points"]
style  = { size = 2.0, color = [0.30, 0.45, 1.0], stride = 2 }

# Side-panel folders. The TurtleBot 4 URDF expands to ~30 links, so we tuck
# them into a collapsed "Robot Description" group by default.
[[ui.group]]
name   = "Sensors"
topics = ["/sensors/lidar3d_0/scan", "/sensors/lidar3d_0/points"]

[[ui.group]]
name      = "Robot Description"
urdf      = true
collapsed = true

# Every frame seen on /tf or /tf_static gets a colored axis indicator (R/G/B
# for X/Y/Z). Per-frame checkbox lets you toggle individuals on or off.
[[ui.group]]
name      = "TF Frames"
tf        = true
collapsed = true
