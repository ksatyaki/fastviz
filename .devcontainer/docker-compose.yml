services:
  fastviz:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: dev
        USER_UID: "1000"
        USER_GID: "1000"
    user: dev
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: 69
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
      WGPU_BACKEND: vulkan
      RUST_LOG: info
    volumes:
      - ..:/workspaces/fastviz:cached
      - ${HOME}/.claude:/home/dev/.claude
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri
    # On a non-NVIDIA host, comment out the deploy block; Mesa llvmpipe is used.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu,compute,utility,graphics,display]
    command: sleep infinity
