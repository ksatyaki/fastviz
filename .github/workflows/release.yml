name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git pkg-config build-essential \
            clang libclang-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev \
            ros-jazzy-tf2-msgs \
            ros-jazzy-nav-msgs \
            ros-jazzy-sensor-msgs \
            ros-jazzy-geometry-msgs \
            ros-jazzy-visualization-msgs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        env:
          LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu
        run: |
          . /opt/ros/jazzy/setup.sh
          cargo build --release --locked --bin app

      - name: Stage artifact
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          name="app-${tag}-x86_64-unknown-linux-gnu"
          cp target/release/app "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm "dist/${name}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
