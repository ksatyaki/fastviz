name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: build ${{ matrix.ros }} (${{ matrix.codename }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros: humble
            codename: jammy
            image: ros:humble-ros-base
          - ros: jazzy
            codename: noble
            image: ros:jazzy-ros-base
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git pkg-config build-essential \
            clang libclang-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev \
            ros-${{ matrix.ros }}-tf2-msgs \
            ros-${{ matrix.ros }}-nav-msgs \
            ros-${{ matrix.ros }}-sensor-msgs \
            ros-${{ matrix.ros }}-geometry-msgs \
            ros-${{ matrix.ros }}-visualization-msgs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-${{ matrix.ros }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deb
        run: |
          if ! command -v cargo-deb >/dev/null; then
            cargo install cargo-deb --locked
          fi

      - name: Build release
        env:
          LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu
          # Bake an rpath so the installed binary finds librcl.so etc. without
          # needing `source /opt/ros/<distro>/setup.bash` first. The build env
          # still needs the setup script sourced so r2r's bindgen can find the
          # ROS message headers.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,/opt/ros/${{ matrix.ros }}/lib"
        run: |
          . /opt/ros/${{ matrix.ros }}/setup.sh
          cargo build --release --locked --bin app

      - name: Stage tarball
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          name="app-${tag}-x86_64-unknown-linux-gnu-${{ matrix.codename }}-${{ matrix.ros }}"
          cp target/release/app "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm "dist/${name}"

      - name: Build .deb
        env:
          LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu
        run: |
          . /opt/ros/${{ matrix.ros }}/setup.sh
          cargo deb -p app --variant ${{ matrix.ros }} --no-build --no-strip
          mv target/debian/*.deb dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
